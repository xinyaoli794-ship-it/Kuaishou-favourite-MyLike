appId: io.mylike.kuaishou
productName: MyLike Kuaishou
electronDist: node_modules/electron/dist
directories:
  output: dist
files:
  - out/**
  - assets/icon.png
  - LICENSE
extraResources:
  - from: public/clips
    to: clips
asar: true
npmRebuild: false
win:
  icon: assets/icon.ico
  target:
    - portable
    - zip
  signExecutable: false
portable:
  artifactName: MyLike-Kuaishou-${version}-win-${arch}-portable.exe
artifactName: MyLike-Kuaishou-${version}-win-${arch}.${ext}
